services:
  cinebuscador:
    build: .
    container_name: cinebuscador3
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/cine3;AUTO_SERVER=TRUE
      - APP_UPLOAD_DIR=/uploads

  integration-tests:
    build:
      context: ./tests
    profiles: ["test"]
    environment:
      - APP_BASE_URL=http://cinebuscador:8080
    depends_on:
      - cinebuscador
